<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>UNIL Rush – Inscription</title>
</h:head>
<h:body>
    <div align="center">
        <p:panel style="width: 600px;">
            <h:graphicImage value="/images/logo.png" width="300"/>
            <h2>Inscription</h2>
        </p:panel>

        <p:panel style="width: 600px;">
            <h:form id="registerForm">
                <table>
                    <tr>
                        <td style="text-align:right">
                            <p:outputLabel value="Nom d'utilisateur"/>
                        </td>
                        <td style="text-align:left">
                            <p:inputText id="username" value="#{registerBean.username}"
                                         style="width: 300px" placeholder="3 à 20 caractères"
                                         required="true" requiredMessage="Le nom d'utilisateur est obligatoire."/>
                        </td>
                    </tr>

                    <tr>
                        <td style="text-align:right">
                            <p:outputLabel value="Mot de passe"/>
                        </td>
                        <td style="text-align:left">
                            <p:password id="password" value="#{registerBean.password}"
                                        style="width: 300px" placeholder="Au moins 8 caractères"
                                        toggleMask="true" feedback="false"
                                        required="true" requiredMessage="Le mot de passe est obligatoire."/>
                        </td>
                    </tr>

                    <tr>
                        <td style="text-align:right">
                            <p:outputLabel value="Faculté"/>
                        </td>
                        <td style="text-align:left">
                            <p:selectOneMenu id="faculty" value="#{registerBean.faculty}"
                                             style="width: 300px"
                                             required="true" requiredMessage="Choisis ta faculté.">
                                <f:selectItem itemLabel="Choisir une faculté" noSelectionOption="true"/>
                                <f:selectItems value="#{registerBean.faculties}"/>
                            </p:selectOneMenu>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td style="text-align:center">
                            <p:commandButton value="S'inscrire" action="#{registerBean.register}" update="@form"/>
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td style="text-align:center">
                            <p:outputLabel value="#{registerBean.message}"/>
                        </td>
                    </tr>
                </table>
                <p:growl id="growl" showDetail="false"/>
            </h:form>
        </p:panel>
    </div>

    <div align="center">
        <p:panel style="width: 600px;">
            <div align="left">
                <h:outputText value="Déjà un compte ? "/>
                <p:link value="Se connecter" outcome="Login"/>
            </div>
        </p:panel>
    </div>
</h:body>
</html>
